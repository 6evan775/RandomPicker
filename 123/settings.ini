; ============================================================
;  随机点名 · 配置文件
;  修改后保存，重新启动程序生效
; ============================================================

[general]
; 音效开关：1 = 开，0 = 关
sound=1
; 音量：0 ~ 100
volume=70
; 开机自启：1 = 开，0 = 关
; 本文件就是开关，程序启动时按这里的值同步注册表
autostart=1

[ui]
; 待机椭圆条的垂直位置：-1 = 自动居中，其它值为屏幕 Y 坐标（拖动后自动写入）
dock_y=-1
; 弹出动画时长（毫秒），范围 80 ~ 1500
anim_ms=260
